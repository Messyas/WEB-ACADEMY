<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de alunos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body class="bg-dark">
    <div class="container py-4">
    <h1 class="mb-4 text-center text-white">Gerenciador de Alunos</h1>

    <!-- Cards de Resumo -->
    <div class="row mb-4">
      <div class="col-md-4">
        <div class="card text-white bg-primary h-100">
          <div class="card-body">
            <h5 class="card-title">Total de Alunos</h5>
            <p id="total-alunos" class="display-4">0</p>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card text-white bg-success h-100">
          <div class="card-body">
            <h5 class="card-title">Média de Alturas (m)</h5>
            <p id="media-alturas" class="display-4">0.00</p>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card text-white bg-info h-100">
          <div class="card-body">
            <h5 class="card-title">Média de Pesos (kg)</h5>
            <p id="media-pesos" class="display-4">0.00</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabela de Alunos -->
    <div class="card">
      <div class="card-header">
        <h5 class="mb-0">Lista de Alunos</h5>
      </div>
      <div class="card-body p-0">
        <table class="table table-bordered mb-0">
          <thead class="table-light">
            <tr>
              <th>Id</th>
              <th>Nome</th>
              <th>Idade</th>
              <th>Altura (m)</th>
              <th>Peso (kg)</th>
            </tr>
          </thead>
          <tbody id="tabela-alunos">
            <!-- registros dinamicas -->
          </tbody>
        </table>
      </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script type="module" src=""></script>
</html>
