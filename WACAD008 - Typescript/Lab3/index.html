<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      .quantity-input {
        width: 70px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-light bg-light mb-4">
      <div class="container">
        <a class="navbar-brand" href="#">Marketplace</a>
        <button class="btn btn-outline-primary position-relative">
          <i class="fas fa-shopping-cart"></i> Carrinho
          <span
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
          >
            2 <span class="visually-hidden">itens no carrinho</span>
          </span>
        </button>
      </div>
    </nav>

    <div class="container py-4">
      <h2 class="mb-4">Seu Carrinho de Compras</h2>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th scope="col" style="width: 40%">Produto</th>
                  <th scope="col" style="width: 15%">Preço</th>
                  <th scope="col" style="width: 15%">Quantidade</th>
                  <th scope="col" style="width: 15%">Subtotal</th>
                  <th scope="col" style="width: 15%" class="text-end">Ação</th>
                </tr>
              </thead>
              <tbody id="cart-items">
                <tr>
                  <td>
                    <h6 class="mb-0">Nome do Produto</h6>
                    <small class="text-muted">descrição do produto</small>
                  </td>
                  <td>R$ 00,00</td>
                  <td>
                    <input
                      type="number"
                      class="form-control form-control-sm quantity-input"
                      value="1"
                      min="1"
                    />
                  </td>
                  <td>R$ 00,00</td>
                  <td class="text-end">
                    <button class="btn btn-sm btn-outline-danger">
                      <i class="fas fa-trash-alt"></i> Remover
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="row justify-content-end">
        <div class="col-md-5 col-lg-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title mb-3">Resumo do Pedido</h5>
              <ul class="list-group list-group-flush">
                <li
                  class="list-group-item d-flex justify-content-between align-items-center"
                >
                  Subtotal
                  <span id="cart-subtotal">R$ 00,00</span>
                </li>
                <li
                  class="list-group-item d-flex justify-content-between align-items-center"
                >
                  Frete
                  <span id="cart-shipping">R$ 00,00</span>
                </li>
                <li
                  class="list-group-item d-flex justify-content-between align-items-center fw-bold"
                >
                  Total
                  <span id="cart-total">R$ 00,00</span>
                </li>
              </ul>
              <div class="d-grid gap-2 mt-4">
                <button class="btn btn-primary btn-lg" type="button">
                  <i class="fas fa-check-circle"></i> Finalizar Compra
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
