<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contato</title>
</head>
<body>
    <h1>Formulario de Contato</h1>
    <p>Por favor, preencha o formulario abaixo e clique no botao Enviar Mensagem. Agracemos por seu contato.</p>
    
    <fieldset>
        <legend>Dados Básicos</legend>
        <label for="some">nome</label>
        <input id="nome" type="text" name="nome"> <br>
        <label for="email">E-mail</label>
        <input id="email" placeholder="seunome@dominio.com.br" type="email" name="E-mail"> <br>
        <label for="site">Website</label>
        <input id="site" type="url" name="site"> <br>
    </fieldset>
    <br>
    <fieldset>
        <legend>Seu curso no Instituo de computacao</legend>
        <input type="checkbox" name="lang" value="cs"> Ciencia da computacao <br>
        <input type="checkbox" name="lang" value="si"> Sistemas de informacao <br>
        <input type="checkbox" name="lang" value="ec"> Engenharia da computacao <br>
    </fieldset>
    <br>
    <fieldset>
        <legend>Assinale as linguagens ja usadas por voce</legend>
        <label for="java">Java</label>
        <input type="checkbox" name="ling" id="java" value="java">
        <label for="c">C</label>
        <input type="checkbox" name="ling" id="c" value="c">
        <label for="c++">C++</label>
        <input type="checkbox" name="ling" id="c++" value="c++">
        <label for="pe">Perl</label>
        <input type="checkbox" name="ling" id="pe" value="perl">
        <label for="python">Python</label>
        <input type="checkbox" name="ling" id="python" value="python">
        <label for="">Jajsvascript</label>
        <input type="checkbox" name="ling" id="js" value="javascript">
    </fieldset>

</body>
</html>
