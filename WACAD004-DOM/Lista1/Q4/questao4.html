<style>
    h1 {
      width: 350px;
      padding: 20px;
      background-color: lightblue;
    }
    .lista {
      width: 350px;
      padding: 20px;
      color: white;
      background-color: lightcoral;
    }
  </style>
  
  <body>
    <h1>Questao 03</h1>
  
    <h3 id="lista-titulo">Meus itens:</h3>
  
    <ul id="lista-itens">
      <li id="one" class="hot">item a</li>
      <li id="two" class="hot">item b</li>
      <li id="three" class="hot">item c</li>
      <li id="four">item d</li>
    </ul>
  </body>

  <script>
    //Ex a)
    let h1color = document.querySelector('h1');
    h1color.style.backgroundColor = 'blue';
    
    //Ex b)
    let newListTitle = document.getElementById('lista-titulo');
    newListTitle.setAttribute('class', 'sub-titulo'); 

    //Ex c) 
    let hots = document.getElementsByClassName('hot');
    for (let hot of hots) {
        hot.style.fontWeight = 'bold';
    }
  </script>
