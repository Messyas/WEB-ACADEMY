<style>
    body{
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgb(0, 24, 9);
        color: white;
    }

    button {
        background: rgb(195, 244, 34);
        color: rgb(23, 54, 14);
    }
</style>
<body>
  <h1>To-do</h1>

  <div>
    <label for="nova-atividade">Lista de atividades:</label>
  </div>

  <div>
    <input id="nova-atividade" placeholder="Digite aqui o item" />
    <button id="btn-adicionar">Adicionar</button>
  </div>

  <ul id="lista-itens">
    <li>item a</li>
  </ul>

  <div>
    <button id="btn-remove">Remover último item</button>
  </div>
</body>

<script>
    let input = document.getElementById('nova-atividade')
    let lista = document.getElementById('lista-itens')
    let btnAdd = document.getElementById('btn-adicionar');
    let btnRemove = document.getElementById('btn-remove');

    btnAdd.addEventListener('click', () => {
        let text = input.value.trim();
        if(text === '') {
            return;
        };
        let li = document.createElement('li');
        li.textContent = text;
        lista.appendChild(li);
        input.value = '';
        input.focus();
    });

    btnRemove.addEventListener('click', () => {
        if (lista.children.length > 0) {
            lista.removeChild(lista.lastElementChild);
        };
    });
</script>
