<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loja WA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
 </head>
  <body>
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Games Strap</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarText">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Início</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">gerenciar produtos</a>
            </li>
          </ul>
          <button type="button" class="btn btn-outline-secondary ">
            sair
          </button>
        </div>
      </div>
    </nav>
    <!-- navbar -->

    <!-- listagem de produtos -->
    <div class="container">
      <h5 class="mt-4 mb-4">Produtos:</h5>
      <div id="produtos-row" class="row g-3 row-cols-1 row-cols-sm-2 row-cols-md-4">
        <!-- prods dinamicos -->
      </div>
    </div>
    <!-- listagem de produtos -->
  </body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</html>

<script>

  let produtos = [
    { titulo: 'Elden Ring',        
    preco: 'R$ 177,00', 
    img: './assets/placeholder-image.png', 
    disponivel: true  },
    { titulo: 'Minecraft',         
    preco: 'R$  99,90', 
    img: './assets/placeholder-image.png', 
    disponivel: true  },
    { titulo: 'Doom The Dark Ages',
    preco: 'R$ 350,00', 
    img: './assets/placeholder-image.png', 
    disponivel: true  },
    { titulo: 'Dark Souls II',     
    preco: 'R$ 133,00', 
    img: './assets/placeholder-image.png', 
    disponivel: false }
  ];

  let linhaProdutos = document.getElementById('produtos-row');

  produtos.forEach(prod => {
    let col = document.createElement('div');
    col.className = 'col';

    let btnClass   = prod.disponivel ? 'btn btn-dark w-100' : 'btn btn-outline-dark w-100 disabled';
    let btnText    = prod.disponivel ? 'Adicionar ao carrinho' : 'Indisponível';
    let indisProdAttr = prod.disponivel ? '' : 'disabled';

    col.innerHTML = `
      <div class="card h-100">
        <img src="${prod.img}" class="card-img-top" alt="${prod.titulo}">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">${prod.titulo}</h5>
          <p class="card-text">${prod.preco}</p>
          <button class="${btnClass}" ${indisProdAttr}>
            ${btnText}
          </button>
        </div>
      </div>
    `;

    linhaProdutos.appendChild(col);
  });
</script>
