<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loja WA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
 </head>
  <body>
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Loja do Calvo</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarText">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Início</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">gerenciar produtos</a>
            </li>
          </ul>
          <button type="button" class="btn btn-secondary">
            sair
          </button>
        </div>
      </div>
    </nav>
    <!-- navbar -->

    <!-- listagem de produtos -->
     <div class="container">
        <h5 class="mt-4 mb-4">Produtos: </h5>
      <div class="row g-3 row-cols-1 row-cols-sm-2 row-cols-md-4">
        <div class="col">
          <div class="card">
            <img src="./assets/placeholder-image.png" class="card-img-top" alt="...">
            <div class="card-body">
              <h5 class="card-title">Bicicleta</h5>
              <p class="card-text">R$ 1.000,00</p>
              <button class="btn btn-primary">
                Adicionar ao carrinho
              </button>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="p-3 border bg-light rounded-1">Coluna 2</div>
        </div>
        <div class="col">
          <div class="p-3 border bg-light rounded-1">Coluna 3</div>
        </div>
        <div class="col">
          <div class="p-3 border bg-light rounded-1">Coluna 4</div>
        </div>
      </div>
     </div>
    <!-- listagem de produtos -->
  </body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
