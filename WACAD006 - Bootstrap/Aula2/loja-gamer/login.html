<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loja WA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  </head>
  <body>
    <div class="container-fluid">
      <div class="row min-vh-100">
        <!-- coluna esquerda -->
        <div
          class="col-12 col-md-4 bg-light d-flex align-items-center justify-content-center">
          <h4 class="text-center">Bem vindo à Games Strap!</h4>
        </div>

        <!-- coluna direita -->
        <div class="col-12 col-md-7 d-flex align-items-center justify-content-center">
          <form class="w-40 w-md-75 w-sm-100" action="./produtos.html" method="POST">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="Digite seu E-mail"
                required
              />
            </div>
            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input
                type="password"
                class="form-control"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
              />
            </div>
            <button type="submit" class="btn btn-success w-100">
              Entrar
            </button>
            <div class="text-center mt-3">
              <a href="./cadastro.html" class="text-primary text-decoration-none">não tenho cadastro</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</html>
