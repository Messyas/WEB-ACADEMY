<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loja WA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  </head>
  <body>
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#index.html">Games Strap</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarText">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="./index.html">Início</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="./produtos.html">gerenciar produtos</a>
            </li>
          </ul>
          <button 
            type="button" 
            class="btn btn-outline-secondary"  
            onclick="window.location.href='./login.html';">
            sair
          </button>
        </div>
      </div>
    </nav>
    <!-- navbar -->

    <!-- gerenciar produtos -->
    <div class="container">
      <h5 class="mt-4 mb-4">Gerenciar Produtos:</h5>
      <div class="d-flex justify-content-end">
        <button type="button" class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#novoProdutoModal">
          Novo produto
        </button>
      </div>
      <div class="table-responsive-sm">
        <table class="table table-striped align-middle m-1">
          <thead>
            <tr>
              <th scope="col">id</th>
              <th scope="col">Produto</th>
              <th scope="col">Preço</th>
              <th scope="col">Estoque</th>
              <th scope="col">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">1</th>
              <td>Elden Ring</td>
              <td >R$ 177,00</td>
              <td>1900</td>
              <td>
                <div class="d-flex justify-content-start gap-2">
                  <button type="button" class="btn btn-dark">Editar</button>
                  <button type="button" class="btn btn-danger">Excluir</button>
                </div>
              </td>
            </tr>
            <tr>
              <th scope="row">2</th>
              <td>Minecraft</td>
              <td>R$ 99,90</td>
              <td>2031</td>
              <td>
                <div class="d-flex justify-content-start gap-2">
                  <button type="button" class="btn btn-dark">Editar</button>
                  <button type="button" class="btn btn-danger">Excluir</button>
                </div>
              </td>
            </tr>
            <tr>
              <th scope="row">3</th>
              <td>Doom The Dark Ages</td>
              <td>R$ 350,00</td>
              <td>42092</td>
              <td>
                <div class="d-flex justify-content-start gap-2">
                  <button type="button" class="btn btn-dark">Editar</button>
                  <button type="button" class="btn btn-danger">Excluir</button>
                </div>
              </td>
            </tr>
            <tr>
              <th scope="row">4</th>
              <td>Dark Souls II</td>
              <td>R$ 133,00</td>
              <td class="text-danger">0</td>
              <td>
                <div class="d-flex justify-content-start gap-2">
                  <button type="button" class="btn btn-dark">Editar</button>
                  <button type="button" class="btn btn-danger">Excluir</button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>

      </div>
        
    </div>
    <!-- gerenciar produtos -->

    <!-- modal cadastrar produtos -->
    <div class="modal fade" id="novoProdutoModal" tabindex="-1" aria-labelledby="novoProdutoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered role="document">
      <div class="modal-content">
        <form id="formNovoProduto">
          <div class="modal-header">
            <h5 class="modal-title" id="novoProdutoModalLabel">
              Novo Produto
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="nomeProduto" class="form-label">Nome do Produto</label>
              <input 
                id="nomeProduto"
                type="text" 
                class="form-control" 
                required/>
            </div>
            <div class="mb-3">
              <label for="precoProduto" class="form-label">Preço</label>
              <input 
                id="precoProduto"
                type="text" 
                class="form-control" 
                required/>
            </div>
            <div class="mb-3">
              <label for="estoqueProduto" class="form-label">Estoque</label>
              <input 
                id="estoqueProduto"
                type="number" 
                class="form-control" 
                min="0" required/>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success w-100">
              Confirmar Cadastro
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <!-- modal cadastrar produtos -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>
